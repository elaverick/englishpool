<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Pool Prototype</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #111; 
            user-select: none; /* Prevents text highlighting while dragging */
        }
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        #power-bar-container {
            position: absolute; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%);
            width: 300px; 
            height: 20px; 
            background: rgba(255, 255, 255, 0.2); 
            border-radius: 10px;
            display: none; 
            border: 2px solid white;
        }
        #power-bar { 
            width: 0%; 
            height: 100%; 
            background: #ff4444; 
            border-radius: 8px; 
        }
        /* Hide the default right-click context menu */
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h2>English Pool Prototype</h2>
        <b>Controls:</b><br>
        * <b>Right-Click + Drag</b>: Orbit camera / Aim<br>
        * <b>Left-Click + Pull Back</b>: Charge shot power<br>
        * <b>Release Left-Click</b>: Shoot<br>
        * <b>WASD / Arrow Keys</b>: Adjust cue-ball strike point
    </div>

    <div id="power-bar-container">
        <div id="power-bar"></div>
    </div>

    <script type="module" src="main.js?v=8ec42e6"></script>
</body>
</html>
